[package]
name = "idc-bot"
authors = ["Lucas A. Miranda <miranda.a.lucas@gmail.com>"]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"

[dependencies]
poise = { version = "0.7.1", features = ["cache"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "fs"] }
thiserror = "2.0.21"
toml = "1.2.1"
enum-display = "0.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
