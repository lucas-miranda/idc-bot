[package]
name = "idc-bot"
authors = ["Lucas A. Miranda <miranda.a.lucas@gmail.com>"]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"

[dependencies]
poise = { version = "0.6.1", features = ["cache"] }
tokio = { version = "1.25.1", features = ["macros", "rt-multi-thread", "signal"] }
thiserror = "2.0.17"
enum-display = "0.2.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
