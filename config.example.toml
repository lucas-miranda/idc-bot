# Example configuration for idc-bot.
#
# Copy this file to your Railway volume, e.g. /data/config.toml, and replace
# the placeholder ids. Set CONFIG_PATH if you mount the volume elsewhere.
#
# Calls can also be managed at runtime with the /call commands.

guild_id = 0
broadcast_channel_id = 0
cooldown_secs = 3600

# Voice channels the bot should leave alone.
ignored_voice_channels = []

# Extra roles allowed to run /recarregar and the /call administrative subcommands.
# Bot owners and members with MANAGE_GUILD can always run them.
reload_roles = []

# Optional: mirror another bot's messages into the text chat of the voice
# channel it is currently connected to. The target channel must be registered
# in call_kinds and currently visible.
[mirror]
source_channel = 1073430430042296421
source_bot = 801167849291776020

[[call_kinds]]
voice_channel = 0
role_id = 0
message = " call aberta! "
